<text x="30" y="48" fill="#8b949e" font-size="24">WHAT THE APPLICATION SENDS</text>
<text x="30" y="105" fill="#79c0ff" font-size="30" font-family="Consolas,monospace">Okay, reading that back. 1 of spell(4L80E). Total $137.53.</text>
