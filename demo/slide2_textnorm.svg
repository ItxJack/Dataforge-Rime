<text x="118" y="750" fill="#e6edf3" font-size="30" font-weight="600">So the authorization token binds to the NORMALISED form,</text>
<text x="118" y="792" fill="#e6edf3" font-size="30" font-weight="600">not the text we wrote. Remove Rime and that binding is unconstructible.</text>
