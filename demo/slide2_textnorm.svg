<text x="30" y="48" fill="#8b949e" font-size="24">WHAT RIME ACTUALLY SPEAKS</text>
<text x="30" y="105" fill="#7ee787" font-size="28" font-family="Consolas,monospace">Okay, reading that back.three of four, L, eight zero, E.</text>
<text x="30" y="145" fill="#7ee787" font-size="28" font-family="Consolas,monospace">Total four hundred twelve dollars fifty nine cents.</text>
